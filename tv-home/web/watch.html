<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV</title>
  <link rel="stylesheet" href="watch.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-movies" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></symbol>
    <symbol id="i-shows" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M8 22h8M12 19v3"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="15" rx="3"/><path d="M7 3h10M10 10l5 3-5 3Z"/></symbol>
    <symbol id="i-apps" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7Z"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 6 3-6 3Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-1 3-3 1-3 3 2 2-1 3 3 3 3-1 2 2 3-1 1-3 3-1v-4l-3-1-1-3h-4Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
  </svg>
  <aside class="sidebar" id="sidebar" aria-label="TV navigation">
    <div class="sidebar-brand"><svg class="icon" aria-hidden="true"><use href="#i-shows"/></svg><span class="nav-label">TV</span></div>
    <nav id="navigation">
      <button class="nav-item" data-page="search" aria-label="Search"><svg class="icon"><use href="#i-search"/></svg><span class="nav-label">Search</span></button>
      <button class="nav-item selected" data-page="home" aria-label="Home" aria-current="page"><svg class="icon"><use href="#i-home"/></svg><span class="nav-label">Home</span></button>
      <button class="nav-item" data-page="movies" aria-label="Movies"><svg class="icon"><use href="#i-movies"/></svg><span class="nav-label">Movies</span></button>
      <button class="nav-item" data-page="shows" aria-label="TV Shows"><svg class="icon"><use href="#i-shows"/></svg><span class="nav-label">TV Shows</span></button>
      <button class="nav-item" data-page="library" aria-label="Library"><svg class="icon"><use href="#i-library"/></svg><span class="nav-label">Library</span></button>
      <button class="nav-item" data-page="apps" aria-label="Apps"><svg class="icon"><use href="#i-apps"/></svg><span class="nav-label">Apps</span></button>
      <div class="nav-separator"></div>
      <button class="nav-item" data-launch="com.google.android.youtube.tv" aria-label="Open YouTube"><svg class="icon"><use href="#i-youtube"/></svg><span class="nav-label">YouTube</span></button>
    </nav>
    <button class="nav-item sidebar-settings" id="settings" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg><span class="nav-label">Settings</span></button>
  </aside>
  <div class="page" id="page">
    <header class="page-header"><span id="page-name">Home</span><time id="clock"></time></header>
    <main id="content"></main>
  </div>
  <div class="toast" id="notice" role="status" aria-live="polite" hidden></div>
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-art" id="detail-art"></div>
    <div class="detail-scrim"></div>
    <button class="detail-back glass-button" id="detail-back" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
    <div class="detail-copy">
      <h1 id="detail-title"></h1><p class="metadata" id="detail-meta"></p>
      <p class="detail-description" id="detail-description"></p>
      <div class="actions" data-nav-group><button class="action primary" id="detail-open"><svg class="icon"><use href="#i-play"/></svg>Watch in Stremio</button></div>
    </div>
  </div>
  <script src="watch.js"></script>
</body>
</html>
