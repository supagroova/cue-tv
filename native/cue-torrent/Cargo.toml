[package]
name = "cue-torrent"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.191"
futures-util = "=0.3.34"
axum = "=0.8.9"
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "f23bacdddcc5318caa813418b8eb1b1d7307faaa", default-features = false, features = ["rust-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "io-util", "net", "time", "macros"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
bencode = { package = "librqbit-bencode", git = "https://github.com/ikatson/rqbit", rev = "f23bacdddcc5318caa813418b8eb1b1d7307faaa" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
reqwest = { version = "=0.12.28", default-features = false }

[patch.crates-io]
librqbit-dualstack-sockets = { path = "vendor/dualstack" }
