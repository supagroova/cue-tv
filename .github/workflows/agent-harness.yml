name: Agent harness
on:
  push:
    paths: ['AGENTS.md', 'CLAUDE.md', '.agents/**', '.claude/skills/**', '.githooks/**', 'scripts/agent/**', 'tests/agent/**', 'docs/agent-harness/**', 'Makefile', '.github/workflows/agent-harness.yml']
  pull_request:
    paths: ['AGENTS.md', 'CLAUDE.md', '.agents/**', '.claude/skills/**', '.githooks/**', 'scripts/agent/**', 'tests/agent/**', 'docs/agent-harness/**', 'Makefile', '.github/workflows/agent-harness.yml']
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: make check
