name: Apple TV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sustained_playback:
        description: Run the optional ten-minute playback qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/.agent-work/native-target
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  native-device:
    name: Native tests and tvOS device build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-apple
        with:
          cache-role: native-device
      - name: Test native Core, peer transfer and range adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-work
          cargo +1.100.0 test --locked --manifest-path native/cue-core/Cargo.toml 2>&1 | tee .agent-work/core-test.log
          cargo +1.100.0 test --locked --manifest-path native/cue-torrent/Cargo.toml 2>&1 | tee .agent-work/native-test.log
      - name: Build unsigned Apple TV app and native device libraries
        shell: bash
        run: |
          set -euo pipefail
          make apple-build 2>&1 | tee .agent-work/apple-build.log
      - name: Upload native and device results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-tv-native-device-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .agent-work/core-test.log
            .agent-work/native-test.log
            .agent-work/apple-build.log

  simulator-tests:
    name: Apple TV simulator tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select available Apple TV simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          candidates = [(runtime, device) for runtime, devices in data['devices'].items()
                        if '.tvOS-' in runtime for device in devices
                        if device.get('isAvailable') and device['name'].startswith('Apple TV')]
          if not candidates:
              raise SystemExit('No available tvOS simulator on this runner; tests cannot run.')
          def rank(item):
              runtime, device = item
              version = tuple(int(n) for n in runtime.split('.tvOS-')[1].split('-'))
              return (version, '4K' in device['name'], device['name'])
          runtime, device = max(candidates, key=rank)
          print(f"Selected {device['name']} on {runtime}: {device['udid']}")
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"DESTINATION=platform=tvOS Simulator,id={device['udid']}\n")
              env.write(f"SIMULATOR_UDID={device['udid']}\n")
          PY
          xcrun simctl list devices available
      - uses: ./.github/actions/setup-apple
        with:
          cache-role: simulator-tests
      - name: Fingerprint simulator native artifact inputs
        id: native-key
        run: echo "key=$(python3 scripts/native/artifact-cache.py key)" >> "$GITHUB_OUTPUT"
      - name: Restore exact simulator native artifacts
        id: native-artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .agent-work/native-artifacts
          key: simulator-native-v1-${{ runner.arch }}-${{ steps.native-key.outputs.key }}
      - name: Verify and install cached native artifacts
        if: steps.native-artifacts.outputs.cache-hit == 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: |
          python3 scripts/native/artifact-cache.py restore "$NATIVE_KEY"
          echo "CUE_NATIVE_CACHE_KEY=$NATIVE_KEY" >> "$GITHUB_ENV"
      - name: Start simulator boot while fixture seeder builds
        run: xcrun simctl boot "$SIMULATOR_UDID"
      - name: Install optional media generator
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        run: brew install ffmpeg
      - name: Generate sustained playback fixture
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        run: python3 scripts/fixtures/generate-long.py
      - name: Build fixture seeder
        if: steps.native-artifacts.outputs.cache-hit != 'true'
        shell: bash
        run: cargo +1.100.0 build --locked --manifest-path native/cue-torrent/Cargo.toml --example seed
      - name: Wait for simulator readiness
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee .agent-work/simulator-boot.log
      - name: Run unit and short playback tests in one build
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/debug/examples/seed" > .agent-work/fixture-seeder.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'Fixture peer ready' .agent-work/fixture-seeder.log; then break; fi
            sleep 1
          done
          grep -q 'Fixture peer ready' .agent-work/fixture-seeder.log
          make apple-ci-test DESTINATION="$DESTINATION" 2>&1 | tee .agent-work/apple-ci-test.log
      - name: Stage verified simulator native artifacts
        if: steps.native-artifacts.outputs.cache-hit != 'true'
        env:
          NATIVE_KEY: ${{ steps.native-key.outputs.key }}
        run: python3 scripts/native/artifact-cache.py save "$NATIVE_KEY"
      - name: Verify ten minutes of direct torrent playback
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        shell: bash
        run: |
          set -euo pipefail
          CUE_LONG_FIXTURE=1 "$CARGO_TARGET_DIR/debug/examples/seed" > .agent-work/long-seeder.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'Fixture peer ready' .agent-work/long-seeder.log; then break; fi
            sleep 1
          done
          grep -q 'Fixture peer ready' .agent-work/long-seeder.log
          make apple-long-test DESTINATION="$DESTINATION" 2>&1 | tee .agent-work/apple-long-test.log
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-tv-simulator-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .agent-work/apple-ci-test.log
            .agent-work/simulator-boot.log
            .agent-work/fixture-seeder.log
            .agent-work/apple-long-test.log
            .agent-work/long-seeder.log
            .agent-work/long-playback/manifest.json
            .agent-work/DerivedData/Logs/Test/*.xcresult

  # Preserve the existing required check while both independent lanes run in parallel.
  build-and-test:
    if: always()
    needs: [native-device, simulator-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Apple TV lane to pass
        env:
          NATIVE_RESULT: ${{ needs.native-device.result }}
          SIMULATOR_RESULT: ${{ needs.simulator-tests.result }}
        run: test "$NATIVE_RESULT" = success && test "$SIMULATOR_RESULT" = success
