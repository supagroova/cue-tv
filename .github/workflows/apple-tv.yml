name: Apple TV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sustained_playback:
        description: Run the optional ten-minute playback qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/.agent-work/native-target
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Restore native and Swift package build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .agent-work/native-target
            .agent-work/DerivedData/SourcePackages
          key: apple-${{ runner.arch }}-rust-1.100.0-xcode-26.6-${{ hashFiles('native/**/Cargo.lock', 'apple-tv/project.yml') }}-${{ github.sha }}
          restore-keys: |
            apple-${{ runner.arch }}-rust-1.100.0-xcode-26.6-${{ hashFiles('native/**/Cargo.lock', 'apple-tv/project.yml') }}-
            apple-${{ runner.arch }}-rust-1.100.0-xcode-26.6-
      - name: Install project generator and report toolchain
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --target aarch64-apple-tvos,aarch64-apple-tvos-sim
      - name: Test and cross-compile Stremio Core environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-work
          cargo +1.100.0 test --locked --manifest-path native/cue-core/Cargo.toml 2>&1 | tee .agent-work/core-test.log
          PLATFORM_NAME=appletvos bash scripts/native/build-core.sh 2>&1 | tee .agent-work/core-device-build.log
          PLATFORM_NAME=appletvsimulator bash scripts/native/build-core.sh 2>&1 | tee .agent-work/core-simulator-build.log
      - name: Test native peer transfer and range adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-work
          cargo +1.100.0 test --locked --manifest-path native/cue-torrent/Cargo.toml 2>&1 | tee .agent-work/native-test.log
          cargo +1.100.0 build --locked --manifest-path native/cue-torrent/Cargo.toml --example seed
      - name: Install optional media generator
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        run: brew install ffmpeg
      - name: Generate sustained playback fixture
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        run: python3 scripts/fixtures/generate-long.py
      - name: Build unsigned Apple TV app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-work
          make apple-build 2>&1 | tee .agent-work/apple-build.log
      - name: Select available Apple TV simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          candidates = [(runtime, device) for runtime, devices in data['devices'].items()
                        if '.tvOS-' in runtime for device in devices
                        if device.get('isAvailable') and device['name'].startswith('Apple TV')]
          if not candidates:
              raise SystemExit('No available tvOS simulator on this runner; tests cannot run.')
          def rank(item):
              runtime, device = item
              version = tuple(int(n) for n in runtime.split('.tvOS-')[1].split('-'))
              return (version, '4K' in device['name'], device['name'])
          runtime, device = max(candidates, key=rank)
          print(f"Selected {device['name']} on {runtime}: {device['udid']}")
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"DESTINATION=platform=tvOS Simulator,id={device['udid']}\n")
              env.write(f"SIMULATOR_UDID={device['udid']}\n")
          PY
          xcrun simctl list devices available
      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Run Apple TV unit tests
        shell: bash
        run: |
          set -euo pipefail
          make apple-test DESTINATION="$DESTINATION" 2>&1 | tee .agent-work/apple-test.log
      - name: Run standalone Playback Lab UI test
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/debug/examples/seed" > .agent-work/fixture-seeder.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'Fixture peer ready' .agent-work/fixture-seeder.log; then break; fi
            sleep 1
          done
          grep -q 'Fixture peer ready' .agent-work/fixture-seeder.log
          make apple-lab-test DESTINATION="$DESTINATION" 2>&1 | tee .agent-work/apple-lab-test.log
      - name: Verify ten minutes of direct torrent playback
        if: github.event_name == 'workflow_dispatch' && inputs.sustained_playback
        shell: bash
        run: |
          set -euo pipefail
          CUE_LONG_FIXTURE=1 "$CARGO_TARGET_DIR/debug/examples/seed" > .agent-work/long-seeder.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'Fixture peer ready' .agent-work/long-seeder.log; then break; fi
            sleep 1
          done
          grep -q 'Fixture peer ready' .agent-work/long-seeder.log
          make apple-long-test DESTINATION="$DESTINATION" 2>&1 | tee .agent-work/apple-long-test.log
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .agent-work/apple-long-test.log
            .agent-work/long-seeder.log
            .agent-work/long-playback/manifest.json
            .agent-work/core-test.log
            .agent-work/core-device-build.log
            .agent-work/core-simulator-build.log
            .agent-work/native-test.log
            .agent-work/fixture-seeder.log
            .agent-work/apple-build.log
            .agent-work/apple-test.log
            .agent-work/apple-lab-test.log
            .agent-work/DerivedData/Logs/Test/*.xcresult
