name: Pinned Apple build environment
description: Restore lane-specific caches and install the pinned project/native tools.
inputs:
  cache-role:
    description: Independent build lane; prevents partial caches overwriting one another.
    required: true
  native-artifact-hit:
    description: Both simulator component caches matched exactly; verification follows setup before use.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore native build cache
      if: inputs.native-artifact-hit != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .agent-work/native-target
        key: apple-native-v2-${{ inputs.cache-role }}-${{ runner.arch }}-rust-1.100.0-xcode-26.6-${{ hashFiles('native/**/Cargo.lock', 'apple-tv/project.yml') }}
        restore-keys: |
          apple-native-v2-${{ inputs.cache-role }}-${{ runner.arch }}-rust-1.100.0-xcode-26.6-
          apple-lanes-v1-${{ inputs.cache-role }}-${{ runner.arch }}-rust-1.100.0-xcode-26.6-${{ hashFiles('native/**/Cargo.lock', 'apple-tv/project.yml') }}-
          apple-lanes-v1-${{ inputs.cache-role }}-${{ runner.arch }}-rust-1.100.0-xcode-26.6-
          apple-nodebug-v1-${{ runner.arch }}-rust-1.100.0-xcode-26.6-${{ hashFiles('native/**/Cargo.lock', 'apple-tv/project.yml') }}
    - name: Restore Swift package cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .agent-work/DerivedData/SourcePackages
        key: apple-swift-v1-${{ inputs.cache-role }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('apple-tv/project.yml') }}
    - name: Keep only native targets used by this lane
      if: inputs.native-artifact-hit != 'true'
      shell: bash
      env:
        CACHE_ROLE: ${{ inputs.cache-role }}
      run: |
        case "$CACHE_ROLE" in
          native-device) rm -rf .agent-work/native-target/aarch64-apple-tvos-sim ;;
          simulator-tests) rm -rf .agent-work/native-target/aarch64-apple-tvos ;;
          *) echo 'Unsupported Apple cache role' >&2; exit 2 ;;
        esac
    - name: Install project generator and report toolchain
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .agent-work/toolchain/xcodegen-2.46.0
        curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output .agent-work/xcodegen-2.46.0.zip
        echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  .agent-work/xcodegen-2.46.0.zip' | shasum -a 256 --check
        unzip -q -o .agent-work/xcodegen-2.46.0.zip -d .agent-work/toolchain/xcodegen-2.46.0
        echo "$GITHUB_WORKSPACE/.agent-work/toolchain/xcodegen-2.46.0/xcodegen/bin" >> "$GITHUB_PATH"
        .agent-work/toolchain/xcodegen-2.46.0/xcodegen/bin/xcodegen --version
        xcodebuild -version
        xcodebuild -showsdks
    - name: Install pinned native toolchain
      if: inputs.native-artifact-hit != 'true'
      shell: bash
      run: rustup toolchain install 1.100.0 --profile minimal --target aarch64-apple-tvos,aarch64-apple-tvos-sim
